    }

    .marketer {
      background: #8e2cf1;
    }

    .role-title {

      margin-bottom: 10px;
    }

<body>

<div class="container">

  <div class="hero">

    <div class="diamond">
      💎
    </div>

    <div class="hero-title">
      هلا بك في شور الجوهرة
    </div>

    <div class="hero-sub">

    </div>

  </div>

  <div class="roles">

    <div class="role-card" onclick="selectRole('merchant')">

      <div class="role-icon merchant">
        🛍️
      </div>

      <div class="role-title">
        أنا تاجر
      </div>

      <div class="role-desc">
        تحليل بياناتك وزيادة مبيعاتك
      </div>

    </div>

    <div class="role-card" onclick="selectRole('marketer')">

      <div class="role-icon marketer">
        📣
      </div>

      <div class="role-title">
        أنا مسوق
      </div>

      <div class="role-desc">
        بناء خطط استراتيجية وإبهار العملاء

  <div class="chat-section" id="chatSection">

    <div class="chat-box" id="chatBox"></div>

    <div class="input-area">

      <input
        type="text"
        id="messageInput"
        placeholder="اكتب رسالتك هنا..."
      >

      <button onclick="sendMessage()">
        إرسال
      </button>

    </div>

  </div>

</div>
  
<script>

let selectedRole = null;

function selectRole(role) {

  selectedRole = role;

  document.querySelector(".hero").style.display = "none";

  document.querySelector(".roles").style.display = "none";

  document.getElementById("chatSection").style.display = "flex";

  document.getElementById("chatSection").style.height = "100vh";

  const chatBox =
    document.getElementById("chatBox");

  const welcome = document.createElement("div");

  welcome.className = "message ai";

  welcome.innerText =
`يا مرحبا ومسهلا
أنا الجوهرة
مساعدتك الذكية لنمو مشروعك ✨`;

  chatBox.appendChild(welcome);

}

```js
async function sendMessage() {

  const input =
    document.getElementById("messageInput");

  const chatBox =
    document.getElementById("chatBox");

  const message =
    input.value.trim();

  if (!message) return;

  const userDiv =
    document.createElement("div");

  userDiv.className =
    "message user";

  userDiv.innerText =
    message;

  chatBox.appendChild(userDiv);

  input.value = "";

  const loadingDiv =
    document.createElement("div");

  loadingDiv.className =
    "message ai";

  loadingDiv.innerText =
    "⏳ جاري التحليل...";

  chatBox.appendChild(
    loadingDiv
  );

  chatBox.scrollTop =
    chatBox.scrollHeight;

  try {

    let conversationId =
      localStorage.getItem(
        "conversation_id"
      );

    const response =
      await fetch(
        "https://smartj-backend-production.up.railway.app/ask",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({

            user_id:
              localStorage.getItem(
                "firebase_uid"
              ),

            message:
              message,

            role:
              selectedRole,

            conversation_id:
              conversationId
                ? Number(
                    conversationId
                  )
                : null
          })
        }
      );

    const data =
      await response.json();

    // 🔥 حفظ conversation id
    if (
      data.conversation_id
    ) {

      localStorage.setItem(
        "conversation_id",
        data.conversation_id
      );
    }

    if (
      data.limitReached
    ) {

      loadingDiv.innerText =
        "✨ وصلت للحد المجاني اليومي";

      return;
    }

    loadingDiv.innerText =
      data.reply ||
      "ما فيه رد";

    chatBox.scrollTop =
      chatBox.scrollHeight;

  } catch (error) {

    loadingDiv.innerText =
      "❌ صار خطأ بالاتصال";
  }
}
  
}

</script>
