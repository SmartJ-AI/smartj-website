<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Smart J Dashboard</title>

  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">

  <style>

    body {
      margin: 0;
      font-family: 'Cairo', sans-serif;
      background: #f8f9fa;
      color: #111;
    }

    .container {
      max-width: 1400px;
      margin: auto;
      padding: 30px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }

    .welcome h1 {
      margin: 0;
      font-size: 42px;
      color: #2e0c7d;
    }

    .welcome p {
      color: gray;
      margin-top: 8px;
      font-size: 18px;
    }

    .profile {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: #2e0c7d;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 28px;
    }

    .search-box {
      background: white;
      border-radius: 22px;
      padding: 18px 24px;
      margin-bottom: 30px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.04);
    }

    .search-box input {
      border: none;
      outline: none;
      width: 100%;
      font-size: 18px;
      font-family: Cairo;
      background: transparent;
    }

    .premium-card {
      background: #2e0c7d;
      border-radius: 35px;
      padding: 40px;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 40px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(46,12,125,0.25);
    }

    .premium-card::before {
      content: "";
      position: absolute;
      width: 500px;
      height: 500px;
      background: rgba(255,255,255,0.05);
      border-radius: 50%;
      top: -200px;
      left: -100px;
    }

    .premium-left {
      position: relative;
      z-index: 2;
    }

    .premium-tag {
      background: rgba(255,255,255,0.15);
      padding: 10px 18px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: bold;
      display: inline-block;
      margin-bottom: 15px;
    }

    .premium-title {
      font-size: 38px;
      font-weight: 900;
      margin-bottom: 10px;
    }

    .premium-sub {
      font-size: 20px;
      opacity: 0.9;
    }

    .premium-btn {
      background: white;
      color: #2e0c7d;
      padding: 16px 28px;
      border-radius: 18px;
      text-decoration: none;
      font-weight: bold;
      font-size: 18px;
    }

    .section-title {
      font-size: 32px;
      color: #2e0c7d;
      margin-bottom: 25px;
      font-weight: bold;
    }

    .tools-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 25px;
    }

    .tool-card {
      background: white;
      border-radius: 28px;
      padding: 35px;
      text-align: center;
      transition: 0.3s;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(0,0,0,0.04);
    }

    .tool-card:hover {
      transform: translateY(-8px);
    }

    .tool-icon {
      width: 80px;
      height: 80px;
      background: #2e0c7d;
      border-radius: 24px;
      margin: auto auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 34px;
    }

    .tool-title {
      font-size: 24px;
      color: #2e0c7d;
      font-weight: bold;
    }

    @media (max-width: 768px) {

      .container {
        padding: 20px;
      }

      .topbar {
        flex-direction: column-reverse;
        align-items: flex-start;
        gap: 20px;
      }

      .welcome h1 {
        font-size: 32px;
      }

      .premium-card {
        flex-direction: column;
        align-items: flex-start;
        gap: 30px;
      }

      .premium-title {
        font-size: 30px;
      }

    }

  </style>

</head>

<body>

  <div class="container">

    <div class="topbar">

      <div class="welcome">
        <h1>مستعد للإبداع؟</h1>
        <p>أهلاً بك في Smart J</p>
      </div>

      <div class="profile">
        👤
      </div>

    </div>

    <div class="search-box">

      🔍

      <input
        type="text"
        placeholder="ابحث عن أداة..."
      >

    </div>

    <div class="premium-card">

      <div class="premium-left">

        <div class="premium-tag">
          PREMIUM
        </div>

        <div class="premium-title">
          شور الجوهرة 💎
        </div>

        <div class="premium-sub">
          مستشارتك التسويقية الذكية
        </div>

      </div>

      <a href="chat.html" class="premium-btn">
        ابدأ الآن
      </a>

    </div>

    <div class="section-title">
      الأدوات الإحترافية
    </div>

    <div class="tools-grid">

      <a href="ads.html" style="text-decoration:none;">

  <div class="tool-card">

    <div class="tool-icon">✍️</div>

    <div class="tool-title">
      كتابة الإعلانات
    </div>

  </div>

</a>

      <div class="tool-card">
        <div class="tool-icon">🎨</div>
        <div class="tool-title">صممي لي</div>
      </div>

      <div class="tool-card">
        <div class="tool-icon">🛍️</div>
        <div class="tool-title">وصف المنتجات</div>
      </div>

      <div class="tool-card">
        <div class="tool-icon">📊</div>
        <div class="tool-title">حلل متجري</div>
      </div>

    </div>

  </div>

</body>

</html>
