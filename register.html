<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>تسجيل الدخول</title>

  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">

  <style>

    body {
      margin: 0;
      font-family: 'Cairo', sans-serif;
      background: #f8f9fa;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      padding: 20px;
      box-sizing: border-box;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 35px;
      border-radius: 30px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.06);
    }

    .logo-container {
      text-align: center;
      margin-bottom: 10px;
    }

    .logo-img {
      width: 130px;
      height: 130px;
      object-fit: contain;
    }

    h1 {
      text-align: center;
      color: #2e0c7d;
      margin-bottom: 30px;
      font-size: 42px;
      font-weight: 900;
    }

    input {
      width: 100%;
      padding: 16px;
      border-radius: 16px;
      border: 1px solid #ddd;
      margin-bottom: 16px;
      font-size: 16px;
      font-family: Cairo;
      box-sizing: border-box;
      transition: 0.2s;
    }

    input:focus {
      outline: none;
      border-color: #8e2cf1;
      box-shadow: 0 0 0 4px rgba(142,44,241,0.08);
    }

    button {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 16px;
      background: linear-gradient(
        90deg,
        #2e0c7d,
        #8e2cf1
      );
      color: white;
      font-size: 18px;
      font-family: Cairo;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      opacity: 0.95;
      transform: translateY(-2px);
    }

    .reset {
      text-align: center;
      margin-top: 16px;
      color: #8e2cf1;
      cursor: pointer;
      font-weight: bold;
    }

    .status {
      margin-top: 20px;
      text-align: center;
      color: red;
      line-height: 1.8;
    }

  </style>

</head>

<body>

<div class="card">

  <div class="logo-container">

    <img
      alt="Smart J"
      class="logo-img"
    >

  </div>

  <h1>
    Smart J
  </h1>

  <input
    type="text"
    id="name"
    placeholder="الاسم"
  >

  <input
    type="email"
    id="email"
    placeholder="الإيميل"
  >

  <input
    type="password"
    id="password"
    placeholder="كلمة المرور"
  >

  <button onclick="registerUser()">
    دخول / إنشاء حساب
  </button>

  <div
    class="reset"
    onclick="resetPassword()"
  >
    نسيت كلمة المرور؟
  </div>

  <div class="status" id="status"></div>

</div>

<script type="module">

import {
  auth,
  signInWithEmailAndPassword,
  createUserWithEmailAndPassword,
  sendPasswordResetEmail
} from "./firebase.js";

async function registerUser() {

  const name =
    document.getElementById("name").value;

  const email =
    document.getElementById("email").value;

  const password =
    document.getElementById("password").value;

  const status =
    document.getElementById("status");

  if (!email || !password) {

    status.innerText =
      "أكمل البيانات";

    return;
  }

  try {

    const result =
      await signInWithEmailAndPassword(
        auth,
        email,
        password
      );

    localStorage.setItem(
      "firebase_uid",
      result.user.uid
    );

    localStorage.setItem(
      "user_email",
      email
    );

    localStorage.setItem(
      "user_name",
      name
    );

await saveDeviceData(
  result.user.uid,
  email
);
    
    window.location.href =
      "index.html";

  } catch {

    try {

      const result =
        await createUserWithEmailAndPassword(
          auth,
          email,
          password
        );

      localStorage.setItem(
        "firebase_uid",
        result.user.uid
      );

      localStorage.setItem(
        "user_email",
        email
      );

      localStorage.setItem(
        "user_name",
        name
      );

await saveDeviceData(
  result.user.uid,
  email
);
      
      window.location.href =
        "index.html";

    } catch (error) {

      status.innerText =
        error.message;

    }

  }

}

async function saveDeviceData(
  userId,
  email
) {

  try {

    await fetch(
      "https://api.smartjh1.com/save-device-data",
      {

        method: "POST",

        headers: {
          "Content-Type":
            "application/json"
        },

        body: JSON.stringify({

          user_id: userId,
          email: email
        })
      }
    );

    console.log(
      "✅ Device data saved"
    );

  } catch (error) {

    console.log(
      "❌ Save device error",
      error
    );
  }
}
  
window.registerUser = registerUser;

async function resetPassword() {

  const email =
    prompt("اكتب الإيميل");

  if (!email) return;

  try {

    await sendPasswordResetEmail(
      auth,
      email
    );

    alert(
      "تم إرسال رابط إعادة التعيين"
    );

  } catch (error) {

    alert(error.message);

  }

}

window.resetPassword = resetPassword;

</script>

<script>

const uid =
  localStorage.getItem("firebase_uid");

if (uid) {

  window.location.href =
    "index.html";

}

</script>

</body>

</html>
