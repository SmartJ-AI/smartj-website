<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>تسجيل الدخول</title>

  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">

  <style>

    body {
      margin: 0;
      font-family: 'Cairo', sans-serif;
      background: #f8f9fa;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 35px;
      border-radius: 30px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.06);
    }

    .logo {
      width: 90px;
      height: 90px;
      margin: auto;
      border-radius: 50%;
      background: linear-gradient(
        135deg,
        #8e2cf1,
        #f4bd38
      );
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 40px;
      margin-bottom: 20px;
    }

    h1 {
      text-align: center;
      color: #2e0c7d;
      margin-bottom: 30px;
    }

    input {
      width: 100%;
      padding: 16px;
      border-radius: 16px;
      border: 1px solid #ddd;
      margin-bottom: 16px;
      font-size: 16px;
      font-family: Cairo;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 16px;
      background: #2e0c7d;
      color: white;
      font-size: 18px;
      font-family: Cairo;
      font-weight: bold;
      cursor: pointer;
    }

    .reset {
      text-align: center;
      margin-top: 16px;
      color: #8e2cf1;
      cursor: pointer;
    }

    .status {
      margin-top: 20px;
      text-align: center;
      color: red;
    }

  </style>

</head>

<body>

<div class="card">

  <div class="logo">
    💎
  </div>

  <h1>
    Smart J
  </h1>

  <input
    type="text"
    id="name"
    placeholder="الاسم"
  >

  <input
    type="email"
    id="email"
    placeholder="الإيميل"
  >

  <input
    type="password"
    id="password"
    placeholder="كلمة المرور"
  >

  <button onclick="registerUser()">
    دخول / إنشاء حساب
  </button>

  <div
    class="reset"
    onclick="resetPassword()"
  >
    نسيت كلمة المرور؟
  </div>

  <div class="status" id="status"></div>

</div>

<script type="module">

import {
  auth,
  signInWithEmailAndPassword,
  createUserWithEmailAndPassword,
  sendPasswordResetEmail
} from "./firebase.js";

async function registerUser() {

  const name =
    document.getElementById("name").value;

  const email =
    document.getElementById("email").value;

  const password =
    document.getElementById("password").value;

  const status =
    document.getElementById("status");

  if (!email || !password) {

    status.innerText =
      "أكمل البيانات";

    return;
  }

  try {

    // تسجيل دخول
    const result =
      await signInWithEmailAndPassword(
        auth,
        email,
        password
      );

    localStorage.setItem(
      "firebase_uid",
      result.user.uid
    );

    localStorage.setItem(
      "user_email",
      email
    );

    localStorage.setItem(
      "user_name",
      name
    );

    window.location.href =
      "dashboard.html";

  } catch {

    try {

      // إنشاء حساب
      const result =
        await createUserWithEmailAndPassword(
          auth,
          email,
          password
        );

      localStorage.setItem(
        "firebase_uid",
        result.user.uid
      );

      localStorage.setItem(
        "user_email",
        email
      );

      localStorage.setItem(
        "user_name",
        name
      );

      window.location.href =
        "dashboard.html";

    } catch (error) {

      status.innerText =
        error.message;
    }

  }

}

window.registerUser = registerUser;

async function resetPassword() {

  const email =
    prompt("اكتب الإيميل");

  if (!email) return;

  try {

    await sendPasswordResetEmail(
      auth,
      email
    );

    alert(
      "تم إرسال رابط إعادة التعيين"
    );

  } catch (error) {

    alert(error.message);

  }

}

window.resetPassword = resetPassword;

</script>

</body>
</html>
