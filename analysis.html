<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>حلل متجري</title>

  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">

  <style>

    body {
      margin: 0;
      font-family: 'Cairo', sans-serif;
      background: #f8f9fa;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    .header {
      background: #2e0c7d;
      color: white;
      padding: 20px;
      border-radius: 20px;
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 30px;
    }

    .hero {
      text-align: center;
      margin-bottom: 40px;
    }

    .hero-circle {
      width: 90px;
      height: 90px;
      background: #2e0c7d;
      border-radius: 50%;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 38px;
      margin-bottom: 20px;
    }

    .hero-title {
      font-size: 32px;
      color: #2e0c7d;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .hero-sub {
      color: gray;
      font-size: 18px;
    }

    .input-box {
      background: white;
      padding: 25px;
      border-radius: 24px;
      margin-bottom: 25px;
    }

    .input-title {
      margin-bottom: 12px;
      color: #2e0c7d;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 18px;
      border-radius: 16px;
      border: 2px solid #ddd;
      font-size: 16px;
      font-family: Cairo;
      box-sizing: border-box;
    }

    input:focus {
      outline: none;
      border-color: #2e0c7d;
    }

    button {
      width: 100%;
      background: linear-gradient(
        90deg,
        #2e0c7d,
        #f4bd38
      );
      color: white;
      border: none;
      padding: 18px;
      border-radius: 18px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      font-family: Cairo;
    }

    .result {
      background: white;
      padding: 30px;
      border-radius: 24px;
      margin-top: 30px;
      line-height: 2;
      white-space: pre-wrap;
      display: none;
    }

  </style>

</head>

<body>

<div class="container">

  <div class="header">
    حلل متجري
  </div>

  <div class="hero">

    <div class="hero-circle">
      📊
    </div>

    <div class="hero-title">
      تحليل المتاجر الذكي
    </div>

    <div class="hero-sub">
      ضع رابط متجرك وأنا أحلل لك كل شيء
    </div>

  </div>

  <div class="input-box">

    <div class="input-title">
      رابط المتجر
    </div>

    <input
      type="text"
      id="storeInput"
      placeholder="https://yourstore.com"
    >

  </div>

  <button onclick="analyzeStore()">
    ابدأ التحليل الآن
  </button>

  <div class="result" id="resultBox"></div>

</div>

<script>

async function analyzeStore() {

  const storeInput =
    document.getElementById("storeInput").value;

  const resultBox =
    document.getElementById("resultBox");

  if (!storeInput) return;

  resultBox.style.display = "block";

  resultBox.innerText = "⏳ جاري تحليل المتجر...";

  try {

    const response = await fetch(
      "https://smartj-backend-production.up.railway.app/analyze",
      {

        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          url: storeInput
        })

      }
    );

    const data = await response.json();

    resultBox.innerText =
      data.analysis || "ما فيه تحليل";

  } catch (error) {

    resultBox.innerText =
      "❌ صار خطأ أثناء التحليل";

  }

}

</script>

</body>
</html>
