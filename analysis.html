<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>حلل متجري</title>

  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">

  <style>

    body {
      margin: 0;
      font-family: 'Cairo', sans-serif;
      background: #f8f9fa;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 20px;
      padding-bottom: 140px;
    }

    .header {
      background: #2e0c7d;
      color: white;
      padding: 20px;
      border-radius: 20px;
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 30px;
    }

    .hero {
      text-align: center;
      margin-bottom: 40px;
    }

    .hero-circle {
      width: 90px;
      height: 90px;
      background: #2e0c7d;
      border-radius: 50%;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 38px;
      margin-bottom: 20px;
    }

    .hero-title {
      font-size: 32px;
      color: #2e0c7d;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .hero-sub {
      color: gray;
      font-size: 18px;
    }

    .input-box {
      background: white;
      padding: 25px;
      border-radius: 24px;
      margin-bottom: 25px;
    }

    .input-title {
      margin-bottom: 12px;
      color: #2e0c7d;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 18px;
      border-radius: 16px;
      border: 2px solid #ddd;
      font-size: 16px;
      font-family: Cairo;
      box-sizing: border-box;
    }

    input:focus {
      outline: none;
      border-color: #2e0c7d;
    }

    button {
      width: 100%;
      background: linear-gradient(
        90deg,
        #2e0c7d,
        #f4bd38
      );
      color: white;
      border: none;
      padding: 18px;
      border-radius: 18px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      font-family: Cairo;
    }

    .result {
      background: white;
      padding: 30px;
      border-radius: 24px;
      margin-top: 30px;
      line-height: 2;
      white-space: pre-wrap;
      display: none;
    }

    .bottom-nav {

      position: fixed;

      bottom: 20px;

      left: 50%;

      transform: translateX(-50%);

      background: white;

      width: 90%;

      max-width: 700px;

      padding: 16px;

      border-radius: 24px;

      display: flex;

      justify-content: space-around;

      box-shadow: 0 10px 40px rgba(0,0,0,0.08);

      z-index: 999;
    }

    .nav-item {

      text-decoration: none;

      color: gray;

      font-size: 14px;

      font-weight: bold;

      text-align: center;
    }

    .nav-item.active {

      color: #2e0c7d;

    }

    body.dark {

  background: #0f1117;

  color: white;

}

body.dark .card,
body.dark .tool-card,
body.dark .bottom-nav,
body.dark .row,
body.dark .search-box,
body.dark .message,
body.dark .input-box,
body.dark textarea,
body.dark input {

  background: #1a1d26 !important;

  color: white !important;

  border-color: #333 !important;

}

body.dark .title,
body.dark .value,
body.dark .section-title,
body.dark .nav-item,
body.dark .tool-title,
body.dark p,
body.dark h1,
body.dark h2,
body.dark h3 {

  color: #eee !important;

}

body.dark .row:hover,
body.dark .tool-card:hover {

  background: #232734 !important;

}
    
  </style>

</head>

<body>

<div class="container">

  <div class="header">
    حلل متجري
  </div>

  <div class="hero">

    <div class="hero-circle">
      📊
    </div>

    <div class="hero-title">
      تحليل المتاجر الذكي
    </div>

    <div class="hero-sub">
      ضع رابط متجرك وأنا أحلل لك كل شيء
    </div>

  </div>

  <div class="input-box">

    <div class="input-title">
      رابط المتجر
    </div>

    <input
      type="text"
      id="storeInput"
      placeholder="https://yourstore.com"
    >

  </div>

  <button onclick="analyzeStore()">
    ابدأ التحليل الآن
  </button>

  <div class="result" id="resultBox"></div>

</div>

<div class="bottom-nav">

<a
href="index.html"
class="nav-item"
>
🏠
<br>
الرئيسية
</a>

<a
href="history.html"
class="nav-item"
>
🕘
<br>
السجل
</a>

<a
href="shoor.html"
class="nav-item"
>
💎
<br>
الجوهرة
</a>

<a
href="settings.html"
class="nav-item"
>
⚙️
<br>
الإعدادات
</a>

</div>

<script>

async function analyzeStore() {

  const storeInput =
    document.getElementById("storeInput").value;

  const resultBox =
    document.getElementById("resultBox");

  if (!storeInput) return;

  resultBox.style.display = "block";

  resultBox.innerText = "⏳ جاري تحليل المتجر...";

  try {

    const response = await fetch(
      "https://smartj-backend-production.up.railway.app/analyze",
      {

        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({

          url: storeInput,

          user_id: localStorage.getItem("firebase_uid")

        })

      }
    );

    const data = await response.json();

if (data.limitReached) {

  resultBox.innerText =
    "👑 وصلت للحد المجاني للتحليل، اشترك للحصول على استخدام غير محدود";

  return;
}
    
    resultBox.innerText =
      data.analysis || "ما فيه تحليل";

  } catch (error) {

    resultBox.innerText =
      "❌ صار خطأ أثناء التحليل";

  }

}

</script>

<script src="auth-check.js"></script>

<script src="chat.js"></script>
  
  <script src="theme.js"></script>
  
</body>
</html>
