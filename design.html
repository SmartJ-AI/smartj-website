<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>صممي لي</title>

  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">

  <style>

    body {
      margin: 0;
      font-family: 'Cairo', sans-serif;
      background: #f8f9fa;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding-bottom: 120px;
      box-sizing: border-box;
    }

    .header {
      background: #2e0c7d;
      color: white;
      padding: 20px;
      font-size: 24px;
      font-weight: bold;
    }

    .chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    .welcome {
      text-align: center;
      margin-top: 40px;
      margin-bottom: 40px;
    }

    .welcome-circle {
      width: 90px;
      height: 90px;
      background: #2e0c7d;
      border-radius: 50%;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 38px;
      margin-bottom: 20px;
    }

    .message {
      max-width: 80%;
      padding: 16px;
      border-radius: 18px;
      margin-bottom: 16px;
      line-height: 1.8;
      white-space: pre-wrap;
    }

    .user {
      background: #8e2cf1;
      color: white;
      margin-right: auto;
    }

    .bot {
      background: white;
      border: 1px solid #eee;
    }

    .design-image {
      width: 100%;
      max-width: 400px;
      border-radius: 18px;
      margin-top: 15px;
    }

    .input-area {
      display: flex;
      gap: 10px;
      padding: 20px;
      background: white;
      border-top: 1px solid #eee;
    }

    input {
      flex: 1;
      padding: 14px;
      border-radius: 14px;
      border: 1px solid #ddd;
      font-size: 16px;
      font-family: Cairo;
    }

    button {
      background: #2e0c7d;
      color: white;
      border: none;
      padding: 14px 24px;
      border-radius: 14px;
      cursor: pointer;
      font-size: 16px;
      font-family: Cairo;
      font-weight: bold;
    }

    .bottom-nav {

      position: fixed;

      bottom: 20px;

      left: 50%;

      transform: translateX(-50%);

      background: white;

      width: 90%;

      max-width: 700px;

      padding: 16px;

      border-radius: 24px;

      display: flex;

      justify-content: space-around;

      box-shadow: 0 10px 40px rgba(0,0,0,0.08);

      z-index: 999;
    }

    .nav-item {

      text-decoration: none;

      color: gray;

      font-size: 14px;

      font-weight: bold;

      text-align: center;
    }

    .nav-item.active {

      color: #2e0c7d;

    }

    body.dark {

  background: #0f1117;

  color: white;

}

body.dark .card,
body.dark .tool-card,
body.dark .bottom-nav,
body.dark .row,
body.dark .search-box,
body.dark .message,
body.dark .input-box,
body.dark textarea,
body.dark input {

  background: #1a1d26 !important;

  color: white !important;

  border-color: #333 !important;

}

body.dark .title,
body.dark .value,
body.dark .section-title,
body.dark .nav-item,
body.dark .tool-title,
body.dark p,
body.dark h1,
body.dark h2,
body.dark h3 {

  color: #eee !important;

}

body.dark .row:hover,
body.dark .tool-card:hover {

  background: #232734 !important;

}

.upload-btn {
  width: 52px;
  height: 52px;
  background: #2e0c7d;
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  color: white;
  font-size: 24px;
  flex-shrink: 0;
}

#imagePreviewContainer {
  padding: 0 20px 12px;
}

.preview-image {
  width: 100px;
  border-radius: 14px;
  border: 2px solid #eee;
}

.preview-wrapper {
  position: relative;
  display: inline-block;
}

.remove-image {
  position: absolute;
  top: -10px;
  left: -10px;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  border: none;
  cursor: pointer;
  font-size: 16px;
  z-index: 9999;
  pointer-events: auto;
}
    
  </style>

</head>

<body>

<div class="container">

  <div class="header">
    صممي لي
  </div>

  <div class="chat-box" id="chatBox">

    <div class="welcome">

      <div class="welcome-circle">
        🎨
      </div>

      <h2>
        يا مرحبا والله
      </h2>

<p>
  🎨 اكتب وش تبي أصمم لك
  <br><br>
  أو احفظ هوية البراند
  <br><br>
  ارفع صورة الشعار أو الهوية
  ثم اكتب:
  <br>
  ✨ احفظي هويتي
</p>

    </div>

  </div>

 <div class="input-area">

  <label class="upload-btn">
    🖼️
    <input
      type="file"
      id="imageInput"
      accept="image/*"
      hidden
    >
  </label>

  <input
    type="text"
    id="messageInput"
    placeholder="اكتب فكرتك هنا..."
  >

  <button onclick="sendMessage()">
    تصميم
  </button>

</div>

<div id="imagePreviewContainer"></div>

</div>

<div class="bottom-nav">

<a
href="index.html"
class="nav-item"
>
🏠
<br>
الرئيسية
</a>

<a
href="history.html"
class="nav-item"
>
🕘
<br>
السجل
</a>

<a
href="shoor.html"
class="nav-item"
>
💎
<br>
الجوهرة
</a>

<a
href="settings.html"
class="nav-item"
>
⚙️
<br>
الإعدادات
</a>

</div>

<script>

let selectedImage = null;

let isEditingDesign = false;
let lastGeneratedImageBlob = null;
let lastPrompt = "";
  
document
  .getElementById("imageInput")
  .addEventListener("change", function (e) {

    const file = e.target.files[0];

    if (!file) return;

    selectedImage = file;

    const previewContainer =
      document.getElementById("imagePreviewContainer");

 previewContainer.innerHTML = `
  <div class="preview-wrapper">

    <button
      class="remove-image"
      id="removeImageBtn"
    >
      ❌
    </button>

    <img
      src="${URL.createObjectURL(file)}"
      class="preview-image"
    >

  </div>
`;
  });

document.addEventListener("click", function (e) {

  if (e.target.id === "removeImageBtn") {

    selectedImage = null;

    document.getElementById(
      "imagePreviewContainer"
    ).innerHTML = "";

    document.getElementById(
      "imageInput"
    ).value = "";
  }

});
  
async function sendMessage() {

  const input = document.getElementById("messageInput");
  const chatBox = document.getElementById("chatBox");

const message = input.value;

if (!isEditingDesign) {
  lastPrompt = message;
}
  
const isSavingBrandIdentity =
  message.trim() === "احفظي هويتي";
  
  if (!message) return;

const userDiv = document.createElement("div");

userDiv.className = "message user";

userDiv.innerHTML = `
  ${message}
  ${
    selectedImage
      ? `
      <br><br>
      <img
        src="${URL.createObjectURL(selectedImage)}"
        class="design-image"
      >
    `
      : ""
  }
`;

chatBox.appendChild(userDiv);

  input.value = "";

input.value = "";
  
  const loadingDiv = document.createElement("div");

  loadingDiv.className = "message bot";
  loadingDiv.innerText = "🎨 جاري تصميم المحتوى...";

  chatBox.appendChild(loadingDiv);

  chatBox.scrollTop = chatBox.scrollHeight;

  try {

if (isSavingBrandIdentity) {

  const formData =
    new FormData();

  formData.append(
    "user_id",
    localStorage.getItem(
      "firebase_uid"
    )
  );

  formData.append(
    "prompt",
    message
  );

  if (selectedImage) {

    formData.append(
      "image",
      selectedImage
    );

  }

  const response =
    await fetch(
      "https://api.smartjh1.com/save-brand-identity-ai",
      {
        method: "POST",
        body: formData
      }
    );

  const data =
    await response.json();

  loadingDiv.innerText =
    data.success
      ? "✅ تم حفظ هويتك بنجاح"
      : "❌ فشل حفظ الهوية";

  return;
}
    
const formData = new FormData();

formData.append("prompt", message);
formData.append("business_type", "متجر");
formData.append("platform", "Instagram");

formData.append(
  "user_id",
  localStorage.getItem("firebase_uid")
);

if (selectedImage) {
  formData.append("image", selectedImage);
}

const response = await fetch(
  "https://api.smartjh1.com/generate-design",
  {
    method: "POST",
    body: formData
  }
);

    const data = await response.json();

if (data.limitReached) {

  loadingDiv.innerText =
    "وصلت للحد المجاني اليومي 👑 اشترك للحصول على استخدام غير محدود";

  return;
}
    
    if (!data.success) {

      loadingDiv.innerText = "❌ فشل إنشاء التصميم";

      return;
    }

    loadingDiv.innerText = "⏳ جاري تجهيز التصميم النهائي...";

    checkStatus(data.taskId, loadingDiv);

  } catch (error) {

    loadingDiv.innerText = "❌ صار خطأ بالاتصال";

  }

}

async function checkStatus(taskId, loadingDiv) {

  try {

    const response = await fetch(
      `https://api.smartjh1.com/design-status?taskId=${taskId}`
    );

    const data = await response.json();

    if (data.status === "completed") {

      loadingDiv.innerHTML = `
        ✅ تم إنشاء التصميم
        <br><br>
        <img
          src="${data.image_url}"
          class="design-image"
        >
      `;

    } else {

      setTimeout(() => {
        checkStatus(taskId, loadingDiv);
      }, 2000);

    }

  } catch (error) {

    loadingDiv.innerText = "❌ فشل تحميل التصميم";

  }

}

</script>

<script src="auth-check.js"></script>

<script src="chat.js"></script>
  
  <script src="theme.js"></script>
  
</body>
</html>
