  <title>Smart J Dashboard</title>

  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">

  <style>

    body {
      margin: 0;
      font-family: 'Cairo', sans-serif;
      background: #f8f9fa;
      color: #111;
    }

    .container {
      max-width: 1400px;
      margin: auto;
      padding: 30px;
      padding-bottom: 140px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }

    .welcome h1 {
      margin: 0;
      font-size: 42px;
      color: #2e0c7d;
    }

    .welcome p {
      color: gray;
      margin-top: 8px;
      font-size: 18px;
    }

    .profile {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: #2e0c7d;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 28px;
      text-decoration: none;
    }

    .search-box {
      background: white;
      border-radius: 22px;
      padding: 18px 24px;
      margin-bottom: 30px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.04);
    }

    .search-box input {
      border: none;
      outline: none;
      width: 100%;
      font-size: 18px;
      font-family: Cairo;
      background: transparent;
    }

    .premium-link {
      text-decoration: none;
    }

    .premium-card {
      background: #2e0c7d;
      border-radius: 35px;
      padding: 40px;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 40px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(46,12,125,0.25);
      transition: 0.3s;
    }

    .premium-card:hover {
      transform: translateY(-6px);
    }

    .premium-card::before {
      content: "";
      position: absolute;
      width: 500px;
      height: 500px;
      background: rgba(255,255,255,0.05);
      border-radius: 50%;
      top: -200px;
      left: -100px;
    }

    .premium-left {
      position: relative;
      z-index: 2;
    }

    .premium-tag {
      background: rgba(255,255,255,0.15);
      padding: 10px 18px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: bold;
      display: inline-block;
      margin-bottom: 15px;
    }

    .premium-title {
      font-size: 38px;
      font-weight: 900;
      margin-bottom: 10px;
    }

    .premium-sub {
      font-size: 20px;
      opacity: 0.9;
    }

    .premium-btn {
      background: white;
      color: #2e0c7d;
      padding: 16px 28px;
      border-radius: 18px;
      text-decoration: none;
      font-weight: bold;
      font-size: 18px;
      position: relative;
      z-index: 2;
    }

    .section-title {
      font-size: 32px;
      color: #2e0c7d;
      margin-bottom: 25px;
      font-weight: bold;
    }

    .tools-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 25px;
    }

    .tool-link {
      text-decoration: none;
    }

    .tool-card {
      background: white;
      border-radius: 28px;
      padding: 35px;
      text-align: center;
      transition: 0.3s;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(0,0,0,0.04);
    }

    .tool-card:hover {
      transform: translateY(-8px);
    }

    .tool-icon {
      width: 80px;
      height: 80px;
      background: #2e0c7d;
      border-radius: 24px;
      margin: auto auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 34px;
    }

    .tool-title {
      font-size: 24px;
      color: #2e0c7d;
      font-weight: bold;
    }

    .bottom-nav {

      position: fixed;

      bottom: 20px;

      left: 50%;

      transform: translateX(-50%);

      background: white;

      width: 90%;

      max-width: 700px;

      padding: 16px;

      border-radius: 24px;

      display: flex;

      justify-content: space-around;

      box-shadow: 0 10px 40px rgba(0,0,0,0.08);

      z-index: 999;
    }

    .nav-item {

      text-decoration: none;

      color: gray;

      font-size: 14px;

      font-weight: bold;

      text-align: center;
    }

    .nav-item.active {

      color: #2e0c7d;

    }

    @media (max-width: 768px) {

      .container {
        padding: 20px;
        padding-bottom: 140px;
      }

      .topbar {
        flex-direction: column-reverse;
        align-items: flex-start;
        gap: 20px;
      }

      .welcome h1 {
        font-size: 32px;
      }

      .premium-card {
        flex-direction: column;
        align-items: flex-start;
        gap: 30px;
      }

      .premium-title {
        font-size: 30px;
      }

    }

    body.dark {

  background: #0f1117;

  color: white;

}

body.dark .card,
body.dark .tool-card,
body.dark .bottom-nav,
body.dark .row,
body.dark .search-box,
body.dark .message,
body.dark .input-box,
body.dark textarea,
body.dark input {

  background: #1a1d26 !important;

  color: white !important;

  border-color: #333 !important;

}

body.dark .title,
body.dark .value,
body.dark .section-title,
body.dark .nav-item,
body.dark .tool-title,
body.dark p,
body.dark h1,
body.dark h2,
body.dark h3 {

  color: #eee !important;

}

body.dark .row:hover,
body.dark .tool-card:hover {

  background: #232734 !important;

}
    
  </style>
