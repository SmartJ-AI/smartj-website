<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>كاتب الإعلانات</title>

  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">

  <style>

    body {
      margin: 0;
      font-family: 'Cairo', sans-serif;
      background: #f8f9fa;
    }

    .container {
      max-width: 900px;
      margin: auto;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      background: #2e0c7d;
      color: white;
      padding: 20px;
      font-size: 24px;
      font-weight: bold;
    }

    .chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    .welcome {
      text-align: center;
      margin-top: 40px;
      margin-bottom: 40px;
    }

    .welcome-circle {
      width: 80px;
      height: 80px;
      background: #2e0c7d;
      border-radius: 50%;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 32px;
      margin-bottom: 20px;
    }

    .message {
      max-width: 75%;
      padding: 14px;
      border-radius: 18px;
      margin-bottom: 14px;
      line-height: 1.8;
    }

    .user {
      background: #8e2cf1;
      color: white;
      margin-right: auto;
    }

    .bot {
      background: white;
      border: 1px solid #eee;
    }

    .input-area {
      display: flex;
      gap: 10px;
      padding: 20px;
      background: white;
      border-top: 1px solid #eee;
    }

    input {
      flex: 1;
      padding: 14px;
      border-radius: 14px;
      border: 1px solid #ddd;
      font-size: 16px;
      font-family: Cairo;
    }

    button {
      background: #2e0c7d;
      color: white;
      border: none;
      padding: 14px 24px;
      border-radius: 14px;
      cursor: pointer;
      font-size: 16px;
      font-family: Cairo;
      font-weight: bold;
    }

  </style>

</head>

<body>

  <div class="container">

    <div class="header">
      كاتب الإعلانات
    </div>

    <div class="chat-box" id="chatBox">

      <div class="welcome">

        <div class="welcome-circle">
          ✨
        </div>

        <h2>
          يا مرحبا والله
        </h2>

        <p>
          اكتب لي وش منتجك وأنا بسوي لك إعلان يبيع 🔥
        </p>

      </div>

    </div>

    <div class="input-area">

      <input
        type="text"
        id="messageInput"
        placeholder="اكتب رسالتك هنا..."
      >

      <button onclick="sendMessage()">
        إرسال
      </button>

    </div>

  </div>

<script>

async function sendMessage() {

  const input = document.getElementById("messageInput");
  const chatBox = document.getElementById("chatBox");

  const message = input.value;

  if (!message) return;

  const userDiv = document.createElement("div");

  userDiv.className = "message user";
  userDiv.innerText = message;

  chatBox.appendChild(userDiv);

  input.value = "";

  const loadingDiv = document.createElement("div");

  loadingDiv.className = "message bot";
  loadingDiv.innerText = "كاتب الإعلانات يكتب الآن...";

  chatBox.appendChild(loadingDiv);

  chatBox.scrollTop = chatBox.scrollHeight;

  try {

    const response = await fetch("https://api.smartjh1.com/ask", {

      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({

        message:
`اكتب إعلان تسويقي احترافي عالي التحويل يحتوي على:
- عنوان جذاب
- نقاط بيع
- دعوة واضحة للشراء

المنتج:
${message}`,

"user_id": localStorage.getItem("firebase_uid")
        
      })

    });

    const data = await response.json();

    loadingDiv.innerText = data.reply || "ما فيه رد";

    chatBox.scrollTop = chatBox.scrollHeight;

  } catch (error) {

    loadingDiv.innerText = "صار خطأ بالاتصال";

  }

}

</script>

</body>

</html>
