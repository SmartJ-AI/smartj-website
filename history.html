<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8" />

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
/>

<title>السجل</title>

<link
  href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap"
  rel="stylesheet"
/>

<style>

*{
  box-sizing:border-box;
}

body {
  margin: 0;
  font-family: 'Cairo', sans-serif;
  background: #f8f9fa;
  transition: .25s;
}

.container {
  max-width: 1000px;
  margin: auto;
  padding: 20px;
}

.header {
  background: linear-gradient(
    90deg,
    #2e0c7d,
    #8e2cf1
  );
  color: white;
  padding: 30px;
  border-radius: 24px;
  margin-bottom: 30px;
}

.header h1 {
  margin: 0;
  font-size: 34px;
}

.header p {
  margin-top: 10px;
  opacity: .9;
}

.history-grid {
  display: grid;
  gap: 18px;
}

.card {
  background: white;
  border-radius: 22px;
  padding: 22px;
  box-shadow:
    0 10px 30px rgba(0,0,0,0.05);
  transition: .25s;
  cursor: pointer;
}

.card:hover {
  transform: translateY(-4px);
}

.user-card {
  border-right:
    6px solid #2e0c7d;
}

.card-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-bottom: 16px;
}

.type {
  background:
    rgba(46,12,125,0.08);

  color: #2e0c7d;

  padding: 8px 14px;

  border-radius: 12px;

  font-size: 14px;

  font-weight: bold;
}

.date {
  color: gray;
  font-size: 14px;
}

.content {
  color: #111;
  line-height: 1.9;
  white-space: pre-wrap;
  overflow-wrap: break-word;
}

.empty {
  text-align: center;
  padding: 80px 20px;
  color: gray;
}

.empty-icon {
  font-size: 60px;
  margin-bottom: 20px;
}

.loading {
  text-align: center;
  color: #2e0c7d;
  margin-top: 50px;
  font-weight: bold;
}

/* DARK MODE */

body.dark {
  background: #0f1117;
  color: white;
}

body.dark .header {
  background:
    linear-gradient(
      90deg,
      #22104d,
      #5c1fb4
    );
}

body.dark .card {
  background: #1a1d26 !important;
  color: white !important;
  border-color: #333 !important;
}

body.dark .content,
body.dark h1,
body.dark h2,
body.dark h3,
body.dark p {
  color: #eee !important;
}

body.dark .date {
  color: #999;
}

body.dark .type {
  background:
    rgba(255,255,255,.08);

  color: #d7c3ff;
}

body.dark .card:hover {
  background: #232734 !important;
}

</style>

</head>

<body>

<div class="container">

  <div class="header">

    <h1>
      السجل
    </h1>

    <p>
      آخر المحادثات والتحليلات والتصاميم
    </p>

  </div>

  <div
    class="loading"
    id="loading"
  >
    جاري تحميل السجل...
  </div>

  <div
    class="history-grid"
    id="historyGrid"
    style="display:none;"
  >
  </div>

  <div
    class="empty"
    id="emptyState"
    style="display:none;"
  >

    <div class="empty-icon">
      🕘
    </div>

    <div>
      لا يوجد سجل بعد
    </div>

  </div>

</div>

<script>

const historyGrid =
  document.getElementById(
    "historyGrid"
  );

const loading =
  document.getElementById(
    "loading"
  );

const emptyState =
  document.getElementById(
    "emptyState"
  );

function escapeHTML(text) {

  if (!text) return "";

  const div =
    document.createElement("div");

  div.innerText = text;

  return div.innerHTML;
}

function formatDate(dateValue) {

  if (!dateValue)
    return "بدون تاريخ";

  const date =
    new Date(dateValue);

  if (
    isNaN(date.getTime())
  ) {
    return "بدون تاريخ";
  }

  return date.toLocaleString(
    "ar-SA"
  );
}

async function loadHistory() {

  try {

    historyGrid.innerHTML = "";

    const userId =
      localStorage.getItem(
        "firebase_uid"
      );

    if (!userId) {

      loading.innerText =
        "لا يوجد مستخدم";

      return;
    }

    const response =
      await fetch(
`https://smartj-backend-production.up.railway.app/history/${userId}`
      );

    if (!response.ok) {
      throw new Error(
        "API ERROR"
      );
    }

    const data =
      await response.json();

    console.log(
      "History Data:",
      data
    );

    loading.style.display =
      "none";

    const items =
      data.conversations ||
      data.messages ||
      [];

    if (
      !items.length
    ) {

      emptyState.style.display =
        "block";

      return;
    }

    historyGrid.style.display =
      "grid";

    items.forEach(item => {

      const card =
        document.createElement(
          "div"
        );

      card.className =
        item.role === "user"
          ? "card user-card"
          : "card";

      const roleText =
        item.role ===
        "assistant"
          ? "الجوهرة"
          : "أنت";

      const message =
        escapeHTML(
          item.message ||
          item.reply ||
          item.title ||
          "ما فيه محتوى"
        );

      const date =
        formatDate(
          item.updated_at ||
          item.created_at
        );

      card.innerHTML = `

        <div class="card-top">

          <div class="type">
            ${roleText}
          </div>

          <div class="date">
            ${date}
          </div>

        </div>

        <div class="content">
          ${message}
        </div>

      `;

      card.addEventListener(
        "click",
        () => {

          if (
            item.conversation_id
          ) {

            localStorage.setItem(
              "conversation_id",
              item.conversation_id
            );

            window.location.href =
              "shoor.html";
          }
        }
      );

      historyGrid.appendChild(
        card
      );
    });

  } catch (error) {

    console.error(error);

    loading.innerText =
      "❌ فشل تحميل السجل";
  }
}

loadHistory();

</script>

<script src="auth-check.js"></script>
<script src="theme.js"></script>

</body>

</html>
